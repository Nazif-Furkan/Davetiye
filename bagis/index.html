<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rümeysa & Furkan - Bağış</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdf5f5;
            --text-main: #4a3b3a;
            --text-accent: #8b6d6a;
            --btn-bg: #d4a3a3;
            --btn-hover: #b88686;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#ecd4d4 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 650px;
            width: 95%;
            margin: 40px auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border-radius: 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            padding: 40px 0;
        }

        .content-wrapper {
            padding: 0 30px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2em;
            color: var(--text-accent);
            letter-spacing: 4px;
            margin: 0;
            font-weight: 600;
        }

        /* Basılı davetiyedeki ile aynı italik serif görünüm */
        .page-subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.15em;
            line-height: 1.7;
            color: var(--text-main);
            margin-top: 20px;
        }

        .divider {
            height: 1px;
            background: var(--btn-bg);
            width: 50%;
            margin: 40px auto;
            opacity: 0.4;
        }

        .video-section {
            margin: 30px 0;
            padding: 20px;
            background: #fcf9f9;
            border-radius: 8px;
            border: 1px solid #f0e6e6;
        }

        .video-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            margin-bottom: 15px;
            color: var(--text-accent);
            letter-spacing: 2px;
        }

        /* Videoyu her ekran boyutunda 16:9 oranında tutar */
        .video-frame {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            border: 1px solid #f0e6e6;
        }

        .video-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-btn {
            display: inline-block;
            background-color: var(--btn-bg);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 500;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .map-btn:hover {
            background-color: var(--btn-hover);
        }

        .year {
            margin-top: 40px;
            font-family: 'Playfair Display', serif;
            font-size: 1.2em;
            color: var(--text-accent);
            letter-spacing: 4px;
        }

        @media (max-width: 480px) {
            .content-wrapper { padding: 0 15px; }
            .page-title { font-size: 1.6em; letter-spacing: 2px; }
            .page-subtitle { font-size: 1.05em; }
            .video-section { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="content-wrapper">

            <h1 class="page-title">BAĞIŞ</h1>
            <div class="page-subtitle">
                Mutluluğumuzu paylaşarak<br>
                çoğaltmak adına,<br>
                bu özel günümüzde sizler için<br>
                Filistin'deki kardeşlerimizin<br>
                sofrasına sıcak yemek ulaştırdık.
            </div>

            <div class="divider"></div>

            <!-- Videoyu değiştirmek için aşağıdaki embed adresindeki YouTube ID'sini güncelleyin -->
            <div class="video-section">
                <div class="video-title">VİDEO</div>
                <div class="video-frame">
                    <iframe
                        src="https://www.youtube-nocookie.com/embed/1hFScOCWJjQ"
                        title="Bağış videosu"
                        loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen></iframe>
                </div>
            </div>

            <a href="../" class="map-btn">← Davetiyeye Dön</a>

            <div class="year">2026</div>
        </div>
    </div>

</body>
</html>
